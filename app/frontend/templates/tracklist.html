<!DOCTYPE html>
<html>
<head>
    <title>Yoto Tracklist Icon Assigner</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/static/main.css">
    <link rel="stylesheet" href="/static/tracklist.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: var(--background);
        }
        .container {
            margin: 40px auto;
            box-shadow: 0 4px 24px rgba(0,0,0,0.07);
            border-radius: 16px;
            background: var(--container-bg);
            padding: 32px 24px 24px 24px;
            max-width: 600px;
        }
        
    </style>
</head>
<body>
    <div class="container">
        <h1 style="text-align:center;">Icon Playlist</h1>
        <div id="trackList"></div>
        <button type="button" id="addTrackBtn" class="download-btn">Add Track</button>
        <button id="downloadTracksBtn" class="download-btn" style="margin-top:24px;">Download Icons</button>
    </div>
    <div id="iconSearchModal" style="display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.18);z-index:200;align-items:center;justify-content:center;">
        <div style="background:#fff;padding:24px;border-radius:16px;max-width:500px;width:90vw;box-shadow:0 4px 24px rgba(0,0,0,0.13);position:relative;">
            <button id="closeModalBtn" style="position:absolute;top:8px;right:8px;" class="removeTrackBtn" aria-label="Close">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <line x1="6" y1="6" x2="18" y2="18" stroke="#718096" stroke-width="2" stroke-linecap="round"/>
                    <line x1="18" y1="6" x2="6" y2="18" stroke="#718096" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </button>
            <h2 id="modalTitle" style="margin-top:0;">Search Track Icon</h2>
            <input type="text" id="modalSearchInput" placeholder="Search icons..." autocomplete="off">
            <div id="modalResultsCount" style="color:#4a5568;font-size:1rem;margin-bottom:8px;"></div>
            <div class="grid" id="modalIconGrid"></div>
            <div id="modalLoading" style="text-align:center;color:rgb(248,94,65);margin:12px 0;display:none;">Loading...</div>
        </div>
    </div>
<script src="/static/track_list.js"></script>
</body>
</html>
