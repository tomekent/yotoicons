<!DOCTYPE html>
<html>
<head>
    <title>Yoto Icon Search</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>Yoto Icon Search</h1>
        <form id="searchForm" autocomplete="off">
            <input type="text" id="query" name="query" 
                    placeholder="Search..."
                   title="Search by keyword, separate multiple terms with commas or semicolons">
            <button type="submit">Search</button>
        </form>
        <div class="shelf-bar" id="shelfBar" style="display:none;">
            <div class="shelf" id="shelf"></div>
        </div>
        <div id="resultsCount" style="text-align:center; color:#4a5568; font-size:1.1rem;"></div>
        <div class="grid" id="iconGrid"></div>
        <div id="loading" style="display:none;">Loading...</div>
    </div>
    <div class="fixed-buttons" id="fixedButtons" style="display:none;">
        <button id="downloadBtn" class="download-btn" disabled>
            Download Selected (<span id="downloadCount">0</span>)
        </button>
        <button id="clearBtn" class="clear-btn" disabled>Clear</button>
    </div>

    <script src="/static/main.js"></script>
</body>
</html>
